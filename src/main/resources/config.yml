c-database-mode: Local # or MySQL

###############################################
# MySQL Settings (MySQL Mode Only)
# ตั้งค่า MySQL สำหรับโหมด MySQL เท่านั้น
###############################################
c-database:
  host: "localhost"
  port: 3306
  username: ""
  password: ""
  database: ""
  # Encrypt the MySQL connection (recommended when the database is on another machine)
  # เข้ารหัสการเชื่อมต่อ MySQL (แนะนำถ้าฐานข้อมูลอยู่คนละเครื่อง)
  use-ssl: false

###############################################
# API Settings
# ตั้งค่า API
###############################################
c-api:
  c-api-enable: false
  # 127.0.0.1 = only this machine can call the API. Use 0.0.0.0 only behind a firewall.
  # 127.0.0.1 = เรียก API ได้เฉพาะเครื่องนี้ ใช้ 0.0.0.0 เฉพาะเมื่อมี firewall ป้องกัน
  c-api-host: 127.0.0.1
  c-api-port: 1558
  # Leave empty to auto-generate a strong key when the API starts.
  # ปล่อยว่างไว้ ระบบจะสร้างคีย์ให้อัตโนมัติตอนเปิด API
  c-api-key: ""

# DoS Protection Settings
c-api-dos-protection:
  enabled: true
  max-requests-per-minute: 100
  request-time-window-ms: 60000
  max-request-size-bytes: 1048576  # 1 MB

###############################################
# Default language
# ภาษาเริ่มต้นของผู้เล่น
###############################################
default-language: en_US
