name: Publish wiki

# Publishes docs/wiki/*.md to the GitHub wiki, so wiki pages are edited with normal commits.
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Push pages to wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          cp docs/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
          else
            git commit -m "Sync wiki from ${{ github.repository }}@${GITHUB_SHA::7}"
            git push origin HEAD
          fi
