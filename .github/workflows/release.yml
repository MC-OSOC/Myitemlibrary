name: Release

# Run manually (Actions → Release → Run workflow) on main with the version, e.g. 1.3.
# Builds the plugin, then creates the tag and GitHub release with the jar attached.
# Release notes come from .github/release-notes/<version>.md if that file exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version / tag to release (must match <version> in pom.xml), e.g. 1.3'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check version matches pom.xml
        run: |
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "pom.xml version: $POM_VERSION"
          if [ "$POM_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::Input version ${{ inputs.version }} does not match pom.xml version $POM_VERSION"
            exit 1
          fi

      - name: Build
        run: mvn -B -ntp package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          NOTES=".github/release-notes/${VERSION}.md"
          ARGS=(--title "$VERSION" --target "$GITHUB_SHA")
          if [ -f "$NOTES" ]; then ARGS+=(--notes-file "$NOTES"); else ARGS+=(--generate-notes); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$VERSION" "target/my-item-library-${VERSION}.jar" "${ARGS[@]}"
