name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The database tests (CoDatabaseTest) run against SQLite, MySQL and MariaDB (open source MySQL fork).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mil
          MYSQL_USER: mil
          MYSQL_PASSWORD: milpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mil
          MARIADB_USER: mil
          MARIADB_PASSWORD: milpass
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      # paper-api 26.x is compiled for Java 25, so the build needs JDK 25.
      # The plugin itself is emitted as Java 21 bytecode (see pom.xml).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        env:
          MIL_TEST_MYSQL_HOST: 127.0.0.1
        run: mvn -B -ntp package

      - name: Check the database tests ran on SQLite and MySQL
        run: python3 .github/scripts/check-db-tests.py target/surefire-reports/TEST-org.cakedek.myitemlibrary.database.CoDatabaseTest.xml "MySQL 8.4"

      - name: Database tests on MariaDB
        env:
          MIL_TEST_MYSQL_HOST: 127.0.0.1
          MIL_TEST_MYSQL_PORT: '3307'
          MIL_TEST_MYSQL_SSL: 'false'
        run: |
          mvn -B -ntp surefire:test
          python3 .github/scripts/check-db-tests.py target/surefire-reports/TEST-org.cakedek.myitemlibrary.database.CoDatabaseTest.xml "MariaDB 11.8"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: MyItemLibrary
          path: target/my-item-library-*.jar
          if-no-files-found: error

  # Regression: MySQL 8 + caching_sha2_password + use-ssl: false failed with
  # "Public Key Retrieval is not allowed" on the first login after a MySQL start (1.4.0 and older).
  # Runs the released 1.4 jar (must reproduce the error) and this build (must connect).
  mysql-pubkey:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: regression MySQL 8.4 use-ssl false (paper 1.21.11)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v7
        with:
          name: MyItemLibrary
          path: plugin

      - name: Download Paper 1.21.11 and the released 1.4 jar
        run: |
          UA="MyItemLibrary-CI (https://github.com/${{ github.repository }})"
          URL=$(curl -fsSL -A "$UA" "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          curl -fsSL -A "$UA" -o server.jar "$URL"
          curl -fsSL -o released-1.4.jar https://github.com/${{ github.repository }}/releases/download/1.4/my-item-library-1.4.jar

      - name: Start MySQL 8.4
        run: |
          docker run -d --name db -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=mil -e MYSQL_USER=mil -e MYSQL_PASSWORD=milpass mysql:8.4
          # Wait for the final server (the entrypoint first runs a temporary one without a TCP port).
          # Log in as root over the socket only, never as 'mil' (that would cache its password hash).
          for i in $(seq 1 90); do
            docker logs db 2>&1 | grep -q "port: 3306 " && docker exec db mysql -uroot -proot -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec db mysql -uroot -proot -e "SELECT user, plugin FROM mysql.user WHERE user = 'mil'"

      - name: Released 1.4 must reproduce the error
        run: .github/scripts/mysql-pubkey-regression.sh server.jar released-1.4.jar fail "released 1.4"

      - name: This build must connect
        run: .github/scripts/mysql-pubkey-regression.sh server.jar plugin/my-item-library-*.jar ok "this build"

  # Start real servers with the plugin: migration from the released 1.3 jar, the REST API,
  # and (where mineflayer supports the version) a bot player that claims items through the GUI.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: paper,  mc: '26.3',    java: '25', db: sqlite, via: true }
          - { platform: paper,  mc: '26.3',    java: '25', db: mysql, via: true }
          - { platform: paper,  mc: '26.3',    java: '25', db: mariadb, via: true }
          - { platform: paper,  mc: '26.1.2',  java: '25', db: sqlite }
          - { platform: paper,  mc: '1.21.11', java: '21', db: sqlite }
          - { platform: paper,  mc: '1.21.11', java: '21', db: mysql }
          - { platform: paper,  mc: '1.20.6',  java: '21', db: sqlite }
          - { platform: spigot, mc: '26.3',    java: '25', db: sqlite, via: true }
          - { platform: spigot, mc: '26.3',    java: '25', db: mariadb, via: true }
          - { platform: spigot, mc: '1.21.11', java: '21', db: sqlite }
    name: smoke ${{ matrix.platform }} ${{ matrix.mc }} ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/download-artifact@v7
        with:
          name: MyItemLibrary
          path: plugin

      # The migration test starts with the released 1.3 jar, then swaps in this build.
      - name: Download released 1.3 jar
        run: curl -fsSL -o old-plugin.jar https://github.com/${{ github.repository }}/releases/download/1.3/my-item-library-1.3.jar

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install bot (mineflayer)
        run: cd .github/scripts/bot && npm install --no-audit --no-fund

      # mineflayer cannot speak 26.3 yet. ViaVersion + ViaBackwards on the server let a 26.1 client join,
      # so the GUI claim tests can run on 26.3 too (the plugin code is the same; only the client is translated).
      - name: Download ViaVersion and ViaBackwards
        if: matrix.via
        run: |
          mkdir -p via
          UA="MyItemLibrary-CI (https://github.com/${{ github.repository }})"
          for p in viaversion viabackwards; do
            # One universal jar for Bukkit/Spigot/Paper; it is not always tagged with every loader.
            Q="loaders=%5B%22paper%22,%22spigot%22,%22bukkit%22%5D"
            curl -fsSL -A "$UA" "https://api.modrinth.com/v2/project/$p/version?$Q&game_versions=%5B%22${{ matrix.mc }}%22%5D" > "$p.json"
            if [ "$(python3 -c "import json; print(len(json.load(open('$p.json'))))")" = "0" ]; then
              echo "No $p release lists ${{ matrix.mc }}; using the newest release"
              curl -fsSL -A "$UA" "https://api.modrinth.com/v2/project/$p/version?$Q" > "$p.json"
            fi
            read -r NAME URL < <(python3 -c "
          import json
          v = [x for x in json.load(open('$p.json')) if x['version_type'] == 'release'] or json.load(open('$p.json'))
          f = next(f for f in v[0]['files'] if f['primary'])
          print(f['filename'], f['url'])")
            echo "$p: $NAME"
            curl -fsSL -A "$UA" -o "via/$NAME" "$URL"
          done

      - name: Start MySQL
        if: matrix.db == 'mysql'
        run: |
          docker run -d --name db -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=mil -e MYSQL_USER=mil -e MYSQL_PASSWORD=milpass mysql:8.4
          for i in $(seq 1 60); do
            docker exec db mysql -umil -pmilpass -h127.0.0.1 -e 'SELECT 1' mil >/dev/null 2>&1 && { echo "MySQL is up"; exit 0; }
            sleep 2
          done
          docker logs db; exit 1

      # MariaDB: the open source MySQL fork. The plugin talks to it in MySQL mode with the server's MySQL driver.
      - name: Start MariaDB
        if: matrix.db == 'mariadb'
        run: |
          docker run -d --name db -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=mil -e MARIADB_USER=mil -e MARIADB_PASSWORD=milpass mariadb:11.8
          for i in $(seq 1 60); do
            docker exec db mariadb -umil -pmilpass -h127.0.0.1 -e 'SELECT 1' mil >/dev/null 2>&1 && { echo "MariaDB is up: $(docker exec db mariadb --version)"; exit 0; }
            sleep 2
          done
          docker logs db; exit 1

      - name: Download Paper ${{ matrix.mc }}
        if: matrix.platform == 'paper'
        run: |
          UA="MyItemLibrary-CI (https://github.com/${{ github.repository }})"
          if ! curl -fsSL -A "$UA" -o latest.json "https://fill.papermc.io/v3/projects/paper/versions/${{ matrix.mc }}/builds/latest"; then
            echo "::error::No Paper build for ${{ matrix.mc }}. Available versions:"
            curl -fsSL -A "$UA" https://fill.papermc.io/v3/projects/paper | python3 -c "import sys,json; print(json.load(sys.stdin)['versions'])"
            exit 1
          fi
          URL=$(cat latest.json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          echo "Downloading $URL"
          curl -fsSL -A "$UA" -o server.jar "$URL"

      - name: Cache Spigot ${{ matrix.mc }}
        if: matrix.platform == 'spigot'
        id: spigot-cache
        uses: actions/cache@v6
        with:
          path: spigot-${{ matrix.mc }}.jar
          key: spigot-${{ matrix.mc }}-${{ github.run_id }}
          restore-keys: spigot-${{ matrix.mc }}-

      - name: Build Spigot ${{ matrix.mc }} with BuildTools
        if: matrix.platform == 'spigot' && steps.spigot-cache.outputs.cache-hit != 'true' && hashFiles(format('spigot-{0}.jar', matrix.mc)) == ''
        run: |
          mkdir -p buildtools && cd buildtools
          curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev ${{ matrix.mc }} --compile SPIGOT --output-dir .. > buildtools.log 2>&1 || { tail -50 buildtools.log; exit 1; }

      - name: Use Spigot jar
        if: matrix.platform == 'spigot'
        run: cp spigot-${{ matrix.mc }}.jar server.jar

      - name: Smoke test
        env:
          OLD_PLUGIN_JAR: old-plugin.jar
          DB_MODE: ${{ matrix.db == 'sqlite' && 'sqlite' || 'mysql' }}
          DB_LABEL: ${{ matrix.db }}
          # MySQL 8.4 is tested with TLS, MariaDB without (also covers use-ssl: false).
          DB_SSL: ${{ matrix.db == 'mariadb' && 'false' || 'true' }}
          MYSQL_CLIENT: ${{ matrix.db == 'mariadb' && 'mariadb' || 'mysql' }}
          MC_VERSION: ${{ matrix.mc }}
          PLATFORM: ${{ matrix.platform }}
          BOT_DIR: .github/scripts/bot
          VIA_DIR: ${{ matrix.via && 'via' || '' }}
          VIA_BOT_VERSION: '1.21.11'
          MYSQL_CONTAINER: ${{ matrix.db != 'sqlite' && 'db' || '' }}
        run: .github/scripts/smoke-test.sh server.jar plugin/my-item-library-*.jar

      - name: Show database tables
        if: always() && matrix.db != 'sqlite'
        run: |
          CLIENT=${{ matrix.db == 'mariadb' && 'mariadb' || 'mysql' }}
          docker exec db $CLIENT -umil -pmilpass -h127.0.0.1 -e 'SELECT VERSION(); SHOW CREATE TABLE co_list_item\G SHOW TABLES' mil || true
